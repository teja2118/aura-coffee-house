
<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#160d09">
    <title>AURA Coffee House</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #160d09;
        }

        body {
            font-family: Georgia, serif;
            color: #f5d4ad;
        }

        .menu-viewer {
            --slide-bg: none;
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #160d09;
        }

        .menu-viewer::before {
            content: "";
            position: absolute;
            inset: -25px;
            background-image: var(--slide-bg);
            background-position: center;
            background-size: cover;
            filter: blur(26px) brightness(.4);
            transform: scale(1.05);
        }

        #menuImage {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background: transparent;
            user-select: none;
            -webkit-user-drag: none;
        }

        .top-controls {
            position: fixed;
            z-index: 5;
            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            display: flex;
            gap: 8px;
        }

        .language-button,
        .home-button,
        .arrow {
            border: 1px solid rgba(239, 194, 145, .6);
            color: #f5d4ad;
            background: rgba(28, 16, 10, .76);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .language-button {
            min-width: 42px;
            padding: 9px 12px;
            border-radius: 30px;
            font-size: 12px;
        }

        .language-button.active,
        .language-button:hover,
        .home-button:hover,
        .arrow:hover {
            background: #d0a477;
            color: #1b100a;
        }

        .home-button {
            position: fixed;
            z-index: 5;
            top: max(14px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 21px;
            text-decoration: none;
        }

        .arrow {
            position: fixed;
            z-index: 5;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 43px;
            height: 58px;
            border-radius: 30px;
            font-family: Georgia, serif;
            font-size: 34px;
        }

        #previous {
            left: max(10px, env(safe-area-inset-left));
        }

        #next {
            right: max(10px, env(safe-area-inset-right));
        }

        @media (max-width: 600px) {
            .home-button {
                width: 36px;
                height: 36px;
            }

            .language-button {
                min-width: 36px;
                padding: 8px 9px;
            }

            .arrow {
                width: 34px;
                height: 48px;
                font-size: 28px;
            }

            #previous {
                left: 4px;
            }

            #next {
                right: 4px;
            }
        }
    </style>
</head>

<body>
<a href="./index.html"
   class="home-button"
   id="homeButton"
   aria-label="Почетна страница">⌂</a>

<div class="top-controls">
    <button class="language-button"
            type="button"
            data-language="mk"
            aria-label="Македонски">MK</button>

    <button class="language-button"
            type="button"
            data-language="en"
            aria-label="English">EN</button>
</div>

<main class="menu-viewer">
    <img id="menuImage"
         src=""
         alt="AURA Coffee House menu"
         draggable="false">
</main>

<button class="arrow"
        id="previous"
        type="button"
        aria-label="Претходна страница">‹</button>

<button class="arrow"
        id="next"
        type="button"
        aria-label="Следна страница">›</button>

<script>


    const pages = {
        mk: [
            {
                src: "images/menu_first.png",
                alt: "AURA Coffee House — Мени"
            },
            {
                src: "images/aura_pijaloci.png",
                alt: "Кафе и пијалаци"
            },
            {
                src: "images/aura_deseti%20.png",
                alt: "Топло чоколадо и десерти"
            },
            {
                src: "images/aura_soleno.png",
                alt: "Вода, сокови и солено мени"
            },
            {
                src: "images/menu_mkdty.png",
                alt: "Ви благодариме за посетата"
            }
        ],

        en: [
            {
                src: "images/menu_first.png",
                alt: "AURA Coffee House — Menu"
            },
            {
                src: "images/aura_drinks.png",
                alt: "Coffee, drinks and matcha"
            },
            {
                src: "images/aura_sweets.png",
                alt: "Hot chocolate and desserts"
            },
            {
                src: "images/aura_salty.png",
                alt: "Water, juices and savoury food"
            },
            {
                src: "images/menu_angty.png",
                alt: "Thank you for visiting AURA Coffee House"
            }
        ]
    };


    const image = document.getElementById("menuImage");
    const viewer = document.querySelector(".menu-viewer");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const home = document.getElementById("homeButton");

    const params = new URLSearchParams(location.search);

    let language = params.get("lang") === "en" ? "en" : "mk";
    let pageIndex = 0;

    function renderPage() {
        const page = pages[language][pageIndex];

        image.onerror = function () {
            image.alt = language === "mk"
                ? "Сликата не е пронајдена. Провери го името на фајлот."
                : "Image not found. Check the filename.";
        };

        image.src = page.src;
        image.alt = page.alt;

        viewer.style.setProperty(
            "--slide-bg",
            'url("' + page.src + '")'
        );

        document.documentElement.lang = language;

        document.title = language === "mk"
            ? "AURA Coffee House — Дигитално мени"
            : "AURA Coffee House — Digital Menu";

        home.setAttribute(
            "aria-label",
            language === "mk"
                ? "Почетна страница"
                : "Home page"
        );

        previous.setAttribute(
            "aria-label",
            language === "mk" ? "Претходна страница" : "Previous page"
        );

        next.setAttribute(
            "aria-label",
            language === "mk" ? "Следна страница" : "Next page"
        );

        document.querySelectorAll("[data-language]").forEach(button => {
            const selected = button.dataset.language === language;

            button.classList.toggle("active", selected);
            button.setAttribute("aria-pressed", String(selected));
        });

        const updatedURL = new URL(location.href);
        updatedURL.searchParams.set("lang", language);

        history.replaceState({}, "", updatedURL);
    }

    function nextPage() {
        pageIndex = (pageIndex + 1) % pages[language].length;
        renderPage();
    }

    function previousPage() {
        pageIndex =
            (pageIndex - 1 + pages[language].length)
            % pages[language].length;

        renderPage();
    }

    document.querySelectorAll("[data-language]").forEach(button => {
        button.addEventListener("click", () => {
            language = button.dataset.language;
            renderPage();
        });
    });

    previous.addEventListener("click", previousPage);
    next.addEventListener("click", nextPage);

    image.addEventListener("click", () => {
        if (pageIndex === 0) nextPage();
    });

    document.addEventListener("keydown", event => {
        if (event.key === "ArrowRight") nextPage();
        if (event.key === "ArrowLeft") previousPage();
    });

    let touchStartX = 0;

    document.addEventListener("touchstart", event => {
        touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    document.addEventListener("touchend", event => {
        const difference =
            event.changedTouches[0].clientX - touchStartX;

        if (Math.abs(difference) < 60) return;

        if (difference < 0) nextPage();
        else previousPage();
    }, { passive: true });

    renderPage();
</script>
</body>
</html>
