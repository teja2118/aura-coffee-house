
<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171312">
    <title>AURA Coffee House — Digital Menu</title>

    <style>
        :root {
            --bg: #171312;
            --panel: #211a18;
            --cream: #f9f1e7;
            --muted: #c6b1a0;
            --gold: #c2a58b;
            --gold-dark: #a0836a;
            --border: rgba(249, 241, 231, .15);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                    radial-gradient(ellipse at top, #35241f 0%, var(--bg) 58%);
            color: var(--cream);
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 20px clamp(16px, 5vw, 65px);
            border-bottom: 1px solid var(--border);
            background: rgba(23, 19, 18, .85);
        }

        a { color: inherit; }

        .back {
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
        }

        .brand {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 24px;
            letter-spacing: 4px;
        }

        .brand small {
            display: block;
            margin-top: 5px;
            color: var(--gold);
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 3px;
        }

        .languages {
            display: flex;
            gap: 7px;
        }

        .languages button,
        .arrow {
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--cream);
            transition: .2s ease;
        }

        .languages button {
            padding: 9px 14px;
            border-radius: 30px;
            font-size: 11px;
        }

        .languages button.active,
        .languages button:hover {
            color: #171312;
            background: var(--gold);
            border-color: var(--gold);
        }

        main {
            width: min(1000px, 100%);
            padding: 38px 18px 55px;
            margin: auto;
        }

        .intro { text-align: center; }

        .eyebrow {
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        h1 {
            margin: 14px 0 10px;
            font-family: Georgia, serif;
            font-size: clamp(35px, 6vw, 58px);
            font-weight: 400;
        }

        .description {
            margin: 0 auto 28px;
            max-width: 550px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .carousel {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr) 48px;
            align-items: center;
            gap: clamp(8px, 2vw, 20px);
        }

        figure {
            margin: 0;
            text-align: center;
            min-width: 0;
        }

        #menuImage {
            display: block;
            width: 100%;
            max-width: 760px;
            max-height: 68vh;
            min-height: 180px;
            margin: auto;
            object-fit: contain;
            border-radius: 5px;
            background: #fff;
            box-shadow: 0 20px 65px rgba(0, 0, 0, .32);
        }

        figcaption {
            padding: 16px 0 7px;
            color: var(--gold);
            font-family: Georgia, serif;
            font-size: 23px;
        }

        .arrow {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            color: var(--gold);
            font-size: 27px;
        }

        .arrow:hover {
            background: var(--gold);
            color: var(--bg);
        }

        .slide-info {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 18px;
            color: var(--muted);
            font-size: 11px;
        }

        #dots {
            display: flex;
            gap: 8px;
        }

        #dots button {
            width: 8px;
            height: 8px;
            padding: 0;
            border: 0;
            border-radius: 100%;
            cursor: pointer;
            background: #65564e;
        }

        #dots button.active { background: var(--gold); }

        .footer-note {
            margin-top: 42px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            text-align: center;
            font-size: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 520px) {
            header { justify-content: space-between; }
            .brand {
                order: -1;
                width: 100%;
                font-size: 21px;
            }
            main { padding-top: 27px; }
            .carousel {
                grid-template-columns: 35px minmax(0, 1fr) 35px;
                gap: 7px;
            }
            .arrow { width: 35px; height: 35px; font-size: 22px; }
            #menuImage { max-height: 62vh; }
        }
    </style>
</head>

<body>
<header>
    <a class="back" id="backLink" href="./index.html">← AURA Coffee House</a>

    <div class="brand">
        AURA
        <small>COFFEE HOUSE</small>
    </div>

    <div class="languages" aria-label="Choose language">
        <button type="button" data-lang="mk">MK</button>
        <button type="button" data-lang="en">EN</button>
    </div>
</header>

<main>
    <section class="intro">
        <div class="eyebrow" id="eyebrow">AURA DIGITAL MENU</div>
        <h1 id="heading">Нашето мени</h1>
        <p class="description" id="description">
            Разгледај ги нашите пијалаци, десерти и солени специјалитети.
        </p>
    </section>

    <section class="carousel" aria-label="Menu images">
        <button class="arrow" id="previous" type="button"
                aria-label="Previous menu image">‹</button>

        <figure>
            <img id="menuImage" src="aura_pijaloci.png"
                 alt="AURA — Пијалаци">
            <figcaption id="slideTitle">Пијалаци</figcaption>
        </figure>

        <button class="arrow" id="next" type="button"
                aria-label="Next menu image">›</button>
    </section>

    <div class="slide-info">
        <span id="counter">1 / 3</span>
        <div id="dots" aria-label="Choose menu image"></div>
        <span id="hint">Користи ги стрелките за следната слика.</span>
    </div>

    <footer class="footer-note" id="footerNote">
        AURA Coffee House · Скопје
    </footer>
</main>

<script>
    const menuContent = {
        mk: {
            title: "Нашето мени",
            description: "Разгледај ги нашите пијалаци, десерти и солени специјалитети.",
            hint: "Користи ги стрелките за следната слика.",
            back: "← Назад на AURA Coffee House",
            footer: "AURA Coffee House · Скопје",
            slides: [
                { src: "aura_pijaloci.png", title: "Пијалаци", alt: "Мени со пијалаци на македонски" },
                { src: "aura_deseti%20.png", title: "Десерти", alt: "Мени со десерти на македонски" },
                { src: "aura_soleno.png", title: "Солено мени", alt: "Солено мени на македонски" }
            ]
        },
        en: {
            title: "Our Menu",
            description: "Explore our drinks, desserts and savoury specialties.",
            hint: "Use the arrows to view the next menu image.",
            back: "← Back to AURA Coffee House",
            footer: "AURA Coffee House · Skopje",
            slides: [
                { src: "aura_drinks.png", title: "Drinks", alt: "AURA drinks menu in English" },
                { src: "aura_sweets.png", title: "Desserts", alt: "AURA desserts menu in English" },
                { src: "aura_salty.png", title: "Savoury Menu", alt: "AURA savoury menu in English" }
            ]
        }
    };

    const params = new URLSearchParams(window.location.search);
    let language = params.get("lang") === "en" ? "en" : "mk";
    let slideIndex = 0;

    const image = document.getElementById("menuImage");
    const title = document.getElementById("heading");
    const description = document.getElementById("description");
    const slideTitle = document.getElementById("slideTitle");
    const dots = document.getElementById("dots");

    function renderMenu() {
        const content = menuContent[language];
        const slide = content.slides[slideIndex];

        document.documentElement.lang = language;
        document.title = "AURA Coffee House — " + content.title;
        title.textContent = content.title;
        description.textContent = content.description;
        slideTitle.textContent = slide.title;
        image.src = slide.src;
        image.alt = slide.alt;

        document.getElementById("eyebrow").textContent =
            language === "mk" ? "AURA ДИГИТАЛНО МЕНИ" : "AURA DIGITAL MENU";
        document.getElementById("hint").textContent = content.hint;
        document.getElementById("backLink").textContent = content.back;
        document.getElementById("footerNote").textContent = content.footer;
        document.getElementById("counter").textContent =
            (slideIndex + 1) + " / " + content.slides.length;

        document.querySelectorAll("[data-lang]").forEach(button => {
            button.classList.toggle("active", button.dataset.lang === language);
            button.setAttribute("aria-pressed", String(button.dataset.lang === language));
        });

        dots.innerHTML = "";
        content.slides.forEach((item, index) => {
            const dot = document.createElement("button");
            dot.type = "button";
            dot.classList.toggle("active", index === slideIndex);
            dot.setAttribute("aria-label", item.title);
            dot.addEventListener("click", () => {
                slideIndex = index;
                renderMenu();
            });
            dots.appendChild(dot);
        });
    }

    function changeLanguage(nextLanguage) {
        language = nextLanguage;
        slideIndex = 0;

        const url = new URL(window.location.href);
        url.searchParams.set("lang", language);
        window.history.replaceState({}, "", url);

        renderMenu();
    }

    document.querySelectorAll("[data-lang]").forEach(button => {
        button.addEventListener("click", () => changeLanguage(button.dataset.lang));
    });

    document.getElementById("previous").addEventListener("click", () => {
        slideIndex = (slideIndex + menuContent[language].slides.length - 1)
            % menuContent[language].slides.length;
        renderMenu();
    });

    document.getElementById("next").addEventListener("click", () => {
        slideIndex = (slideIndex + 1) % menuContent[language].slides.length;
        renderMenu();
    });

    renderMenu();
</script>
</body>
</html>
